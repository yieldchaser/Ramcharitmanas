name: fetch-day03
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download Day 03 audio (tries multiple YouTube clients)
        run: |
          pip install -q yt-dlp
          for client in android ios tv_embedded; do
            echo "::group:: Trying player_client=$client"
            if yt-dlp --no-warnings --extractor-args "youtube:player_client=$client" \
              --sleep-requests 2 -f "ba/b" -x --audio-format mp3 --audio-quality 128K \
              --embed-metadata --embed-thumbnail --retries 10 --socket-timeout 30 \
              --concurrent-fragments 4 \
              -o "Mahabharat Katha Pandharpur - Day 03.%(ext)s" \
              "https://www.youtube.com/watch?v=_zgNaywsvuk"; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
          done
          test -f "Mahabharat Katha Pandharpur - Day 03.mp3"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: day03-mp3
          path: "Mahabharat Katha Pandharpur - Day 03.mp3"
          retention-days: 1
